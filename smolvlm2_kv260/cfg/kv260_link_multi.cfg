# =============================================================================
# kv260_link_multi.cfg  —  Optional multi-kernel link config
# =============================================================================
# Use this when decoder, ViT, and connector XO files are all available.

[connectivity]
nk=smolvlm2_decoder_layer:1:decoder_1
nk=smolvlm2_vit_prefill_kernel:1:vit_1
nk=smolvlm2_connector_kernel:1:connector_1

sp=decoder_1.gmem_ap:HPC0
sp=decoder_1.gmem_ao:HPC0
sp=decoder_1.gmem_w0:HPC0
sp=decoder_1.gmem_w1:HPC1
sp=decoder_1.gmem_m0:HPC1
sp=decoder_1.gmem_m1:HPC1
sp=decoder_1.gmem_kc:HPC1
sp=decoder_1.gmem_vc:HPC1
sp=decoder_1.gmem_g0:HPC1
sp=decoder_1.gmem_g1:HPC1
sp=decoder_1.gmem_lw:HPC1
sp=decoder_1.gmem_lm:HPC1
sp=decoder_1.gmem_lo:HPC0

sp=vit_1.gmem_vact:HPC0
sp=vit_1.gmem_vw:HPC1
sp=vit_1.gmem_vm:HPC1
sp=vit_1.gmem_vout:HPC0

sp=connector_1.gmem_cact:HPC0
sp=connector_1.gmem_cw:HPC1
sp=connector_1.gmem_cm:HPC1
sp=connector_1.gmem_cout:HPC0

[advanced]
prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=ExploreWithRemap
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=ExploreWithRemap
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
