# =============================================================================
# kv260_link.cfg  —  v++ 链接配置（SmolVLM2 × KV260）
# =============================================================================
# 端口分配策略：
#   HPC0：激活（act_ping/pong/out）+ 权重前半（wgt_half0）
#   HPC1：权重后半（wgt_half1）+ meta（meta_half0/1）+ KV Cache + lm_head
# 两个 HP 口各约 4 GB/s，避免 GEMM 激活与权重争用同一物理接口
# =============================================================================

[connectivity]

# ---------------------------------------------------------------------------
# Kernel 实例（单 kernel，单实例）
# ---------------------------------------------------------------------------
nk=smolvlm2_decoder_layer:1:decoder_1

# ---------------------------------------------------------------------------
# AXI Master 端口 → DDR Bank 绑定
#
# KV260 内存资源：
#   PS DDR4：4GB，由 PS 管理（HPC0/HPC1 均连接此 DDR）
#   HPC0/HPC1：HP AXI 接口，各约 4 GB/s（实测 ≈ 8 GB/s 合计）
# ---------------------------------------------------------------------------

# 激活 Ping-Pong（HPC0，与权重前半共口但不同 channel）
sp=decoder_1.gmem_ap:HPC0

# 激活输出（HPC0，写路径）
sp=decoder_1.gmem_ao:HPC0

# 权重前半（HPC0，与激活同口——AXI 仲裁，GEMM 计算期间激活已在片上）
sp=decoder_1.gmem_w0:HPC0

# 权重后半（HPC1，独立物理接口，约 4 GB/s 独享）
sp=decoder_1.gmem_w1:HPC1

# GroupMeta 前半（HPC1，与权重后半同口，meta 数据量小，不争用）
sp=decoder_1.gmem_m0:HPC1

# GroupMeta 后半（HPC1）
sp=decoder_1.gmem_m1:HPC1

# KV Cache K（HPC1，DDR 带宽：5 heads × 2000 seq × 64 dim × 0.5 B ≈ 0.6 MB）
sp=decoder_1.gmem_kc:HPC1

# KV Cache V（HPC1）
sp=decoder_1.gmem_vc:HPC1

# gamma（RMSNorm 参数，数据量极小：960 byte，HPC1 顺带）
sp=decoder_1.gmem_g0:HPC1
sp=decoder_1.gmem_g1:HPC1

# lm_head 权重（HPC1，N=49280，约 23 MB）
sp=decoder_1.gmem_lw:HPC1
sp=decoder_1.gmem_lm:HPC1

# lm_head 输出 logits（HPC0，写路径，PS 端读取做 Top-K）
sp=decoder_1.gmem_lo:HPC0

# ---------------------------------------------------------------------------
# AXI 时钟（单时钟域 200 MHz）
# ---------------------------------------------------------------------------
# [clock]
# freqHz=200000000:decoder_1

# ---------------------------------------------------------------------------
# 高级选项
# ---------------------------------------------------------------------------
[advanced]
# 关闭 v++ 自动 bank 分配（手动绑定更可控）
prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=ExploreWithRemap
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=ExploreWithRemap
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
